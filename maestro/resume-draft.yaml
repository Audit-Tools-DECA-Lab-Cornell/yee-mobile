# Draft durability across an app restart (MMKV per-account draft persistence,
# lib/yee-secure-draft-storage.ts). Starts/resumes an audit, kills + relaunches
# the app, and confirms the in-progress draft survives.
# Android appId: com.andisha2004.audittoolsyeemobile
# iOS bundleId:  com.andisha2004.yee-mobile
appId: com.andisha2004.audittoolsyeemobile
---
- runFlow: assigned-places.yaml
# Enter the audit flow — new or resume, whichever the seeded place offers.
- runFlow:
      when:
          visible: "Continue draft"
      commands:
          - tapOn: "Continue draft"
- runFlow:
      when:
          visible: "Start audit"
      commands:
          - tapOn: "Start audit"
- extendedWaitUntil:
      visible: ".*Assigned place.*|.*Setup and weighting.*|.*Next.*|.*Section.*"
      timeout: 30000
# Kill and relaunch — the draft must be restored from MMKV (no clearState).
- stopApp
- launchApp
- extendedWaitUntil:
      visible: ".*Active auditor.*|.*Places.*|.*Continue draft.*|.*Resume audit.*"
      timeout: 30000
- tapOn: "Places"
- assertVisible:
      text: ".*Continue draft.*|.*Resume audit.*|.*Drafts.*"
