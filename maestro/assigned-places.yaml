# Assigned-places visibility. The seeded auditor (auditor-demo-1 = AUD001) has
# place assignments, so the Places tab must surface at least one place-action
# affordance. Source: app/(tabs)/places.tsx.
# Android appId: com.andisha2004.audittoolsyeemobile
# iOS bundleId:  com.andisha2004.audit-tools-yee-mobile
appId: com.andisha2004.audit-tools-yee-mobile
---
- runFlow: login.yaml
# Tap the Places TAB by its unique a11y label ("Places, tab, 2 of 4"); avoids the
# "PLACES" stat card. Maestro full-matches, so the .* wrapper is required.
- tapOn: ".*Places, tab.*"
- extendedWaitUntil:
      visible: "(?i).*(start audit|continue draft|view report).*"
      timeout: 30000
# Meaningful assertion: a per-place action must be present (NOT the empty state).
- assertVisible:
      text: "(?i).*(start audit|continue draft|view report).*"
