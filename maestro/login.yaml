# Auditor-only native E2E flow for the YEE Expo development build.
# Android appId: com.andisha2004.audittoolsyeemobile
# iOS bundleId:  com.andisha2004.audit-tools-yee-mobile
#
# Login selectors use visible text / placeholder text; domain question flows use
# stable IDs documented in maestro/README.md "Stable selectors".
# Login screen source: app/(auth)/login.tsx.
appId: ${APP_ID || "com.andisha2004.audit-tools-yee-mobile"}
---
# IDEMPOTENT login - does NOT clearState. clearState wipes the SecureStore
# session (and MMKV drafts) on every launch, forcing a slow cold reconnect to the
# Metro dev server + a full re-login for EVERY flow. Without it, launchApp restores
# the persisted session and we only log in when the login screen is actually shown.
- launchApp
# Wait for the app to settle on EITHER the login screen or the dashboard - a dev
# build can take a while to connect to Metro / load the bundle on first launch.
- extendedWaitUntil:
      visible: ".*Log in to the YEE workspace.*|.*Active auditor.*|.*Places available.*"
      timeout: 60000
# Only run the login steps if the login screen is up; a persisted session skips this.
- runFlow:
      when:
          visible: "Log in to the YEE workspace."
      commands:
          # Email field - placeholder is visible while empty, so tap it by text.
          - tapOn: "auditor@example.com"
          - inputText: "auditor-demo-1@yee.local"
          - tapOn: "Enter password"
          - inputText: "DemoPass123!"
          # iOS has no standard keyboard-dismiss for this form (hideKeyboard fails on
          # iOS 26), so tap the unique heading to dismiss the keyboard first.
          - tapOn: "Log in to the YEE workspace."
          # The screen has a TITLE Text that is ALSO exactly "Log in" (login.tsx:151),
          # so a plain text match taps the title, not the button. Target the SUBMIT
          # BUTTON positionally - the "Log in" below the stay-signed-in row.
          - tapOn:
                text: "Log in"
                below:
                    text: "Stay signed in for offline field work"
          - extendedWaitUntil:
                visible: ".*Active auditor.*|.*Places available.*|.*Dashboard.*"
                timeout: 30000
# Landing = the (tabs) group: Dashboard/Home with the "Active auditor" badge.
- assertVisible: ".*Active auditor.*|.*Places available.*|.*Dashboard.*"
